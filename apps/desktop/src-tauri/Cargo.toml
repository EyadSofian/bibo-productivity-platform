[package]
name = "ctracking"
version = "1.5.10"
description = "Transparent employee time and activity tracker"
authors = ["BiBoTracking"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ctracking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
active-win-pos-rs = "0.8"
tauri-plugin-dialog = "2"
csv = "1"
xcap = "0.9"
webp = "0.3"
axum = "0.7"
# "sync" is required by sync::commands (Notify). It was previously reaching us
# only through another crate's feature unification, which could vanish silently.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Cross-platform OS CSPRNG for the browser-ingest token (replaces /dev/urandom).
getrandom = "0.2"
# Error reporting (Rust core). rustls to match reqwest; no native-tls/openssl.
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2"
os_info = "3.15.0"
hostname = "0.4.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
time = { version = "0.3", features = ["formatting"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }

# macOS-only: CoreFoundation bindings used by the permission/event-tap backend.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Windows-only: Win32 bindings for activity tracking and the company-managed
# agent supervisor. The supervisor is a normal Windows service installed by the
# per-machine NSIS package; the employee-facing tray application remains visible.
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.8.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


# Backend environment selected at compile time. Resolution order in code is
# local > staging > production (see settings::DEFAULT_BACKEND_URL). The runtime
# CTRACKING_BACKEND_URL env var still overrides everything (used in dev).
#   local:      cargo ... --no-default-features --features local
#   staging:    cargo ... --no-default-features --features staging
#   production: default
[features]
default = ["production"]
local = []
staging = []
production = []
