[package]
name = "media-publisher"
version = "0.1.0"
edition = "2021"
description = "Windows screen capture sidecar for the BiBoTracking video-first media plane"
publish = false
autobins = false

# Standalone crate: deliberately NOT part of the Tauri app's build. The sidecar is a
# separate process so a capture or encoder crash can never take down the agent UI.
[workspace]

[lib]
name = "media_publisher"
path = "src/lib.rs"

[[bin]]
name = "media-publisher"
path = "src/main.rs"

# Capture backend benchmark. Produces the measurements ADR 0003 is based on.
[[bin]]
name = "capture-bench"
path = "src/bin/capture_bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# Windows Graphics Capture (WinRT). Wraps the same API the OS ships; pinned so a
# backend change is always a deliberate, reviewed bump.
windows-capture = "2.0.1"

# Microsoft's official Windows bindings, used for DXGI Desktop Duplication and for
# the D3D11 device shared by both backends.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # Remote control (V07): SendInput, and DPI awareness so the coordinates it
    # receives are physical pixels rather than scaled ones.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }

livekit = { version = "0.8.4", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dev-dependencies]
futures-util = "0.3"
livekit-api = { version = "0.6.4", default-features = false, features = ["access-token", "rustls-tls-native-roots"] }
