name: Build desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            bundle: app,dmg
            artifact: macos-installer
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows MSI + updater
            os: windows-latest
            bundle: msi,nsis
            artifact: windows-installer
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm --filter @ctracking/desktop tauri build
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.railway.conf.json

      - name: Smoke-test Windows managed-agent installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait

          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)"
          }

          $service = Get-Service -Name "BiBoTrackingSupervisor" -ErrorAction Stop

          if ($service.Status -ne "Running") {
            Start-Service -Name "BiBoTrackingSupervisor"
            $service.WaitForStatus("Running", [TimeSpan]::FromSeconds(20))
          }

          $serviceConfig = sc.exe qc "BiBoTrackingSupervisor"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect BiBoTrackingSupervisor"
          }

          $serviceConfig | Out-String | Write-Host

          if (($serviceConfig | Out-String) -notmatch "AUTO_START") {
            throw "BiBoTrackingSupervisor is not configured for automatic startup"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Signed updater manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json
        run: >-
          node scripts/generate-updater-manifest.mjs
          --assets release-assets
          --base-url https://web-production-25e92.up.railway.app/download
          --output release-assets/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release-assets
          if-no-files-found: error
          retention-days: 30
